# tmux.conf: jesusci's tmux configuration files
# =============================================================================

# Split panes with "|" (horizontal) and "-" (vertical) and open panes in current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# 256 color terminal
set -g default-terminal "screen-256color"

# Set the prefix for tmux to Ctrl+A
unbind C-b
set -g prefix C-a
bind C-a send-prefix
set -s escape-time 0

# First window is window 1
set -g base-index 1
set -g renumber-windows on

# Mouse control
set -g mouse on

# Status bar appearance
set -g status-position top
set -g status-justify left
set -g status-bg black
set -g status-fg brightblack
set -g window-status-current-style bg=cyan
set -g mode-style fg=black
set -g mode-style blink
set -g window-status-format "#[fg=white,bg=brightblack] #I #[bg=black] #W#F "
set -g window-status-current-format " #I  #W#F "
set -g allow-rename off

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Left status bar: session name
set -g status-left-length 100
setw -g status-left-style bg=blue
setw -g status-left-style fg=white
set -g status-left " #S #[bg=black] "

# Right status bar: host name, date and time
set -g status-right-length 100
set -g status-right-style bg=brightblack
set -g status-right-style fg=white

# Showing CPU use
set -g status-right '#[fg=white,bg=brightblack] CPU: #(awk "/^cpu / {print int(100 - (\$5 * 100 / (\$2+\$3+\$4+\$5+\$6+\$7+\$8)))}" /proc/stat)% #[default] #[fg=white]%H:%M#[default]'

# Panes theme
set -g pane-border-lines heavy
set -g pane-border-style fg=colour238
set -g pane-active-border-style "fg=cyan,bold"

# Moving between windows
bind -n C-PgUp select-window -t :-
bind -n C-PgDn select-window -t :+

# Clock theme
set -g clock-mode-colour cyan
set -g clock-mode-style 24

# Monitor activities
set -g monitor-activity on
set -g visual-activity on

# Identify pane with pane_id
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=white#,bg=blue#,bold] #{pane_id} #[fg=white#,bg=black] #(cd #{pane_current_path}; git rev-parse --show-toplevel 2>/dev/null || echo '#{pane_current_command}') #[default],#[fg=colour245] #{pane_id} | #{pane_current_command} #[default]}"

# Reload config file
bind r source-file ~/.tmux.conf

# Plugin manager (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'alexwforsythe/tmux-which-key'

run '~/.tmux/plugins/tpm/tpm'

source-file -q ~/.tmux/local.d/tmux.conf
